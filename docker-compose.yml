services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_membership
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-postgres}@db:5432/church_membership
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      PORT: 3001
      # Password-reset email. Without RESEND_API_KEY the reset link is logged to
      # the api container's stdout instead of emailed. Set APP_URL to the public
      # origin of the web app so the link in the email is correct.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Belong <noreply@belong.cyberworksgy.com>}
      APP_URL: ${APP_URL:-http://localhost:5173}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"

  web:
    build:
      context: ./web
      args:
        # Same-origin by default: the web container's nginx proxies /api -> api:3001.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    # No host port here. For local dev, docker-compose.override.yml publishes 8080
    # (see docker-compose.override.yml.example). In production, front it with a
    # reverse proxy — see "Deploying behind Traefik" in the README.

volumes:
  db_data:
  uploads_data:
