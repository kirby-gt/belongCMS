services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_membership
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    # No host port: only the api container talks to Postgres, over the compose
    # network. Docker-published ports bypass host firewalls like ufw, so
    # publishing 5432 here exposed the database to the internet. For local
    # tooling, publish it from docker-compose.override.yml instead.

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:5432/church_membership
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 3001
      # Password-reset email. Without RESEND_API_KEY the reset link is logged to
      # the api container's stdout instead of emailed. Set APP_URL to the public
      # origin of the web app so the link in the email is correct.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Belong <noreply@belongcms.org>}
      APP_URL: ${APP_URL:-http://localhost:5173}
      # Operator inbox notified whenever a new church signs up for a trial.
      # Blank/unset -> no alert is sent (only the admin's own welcome email).
      SIGNUP_ALERT_EMAIL: ${SIGNUP_ALERT_EMAIL:-}
      # Operator inbox notified whenever an org submits an MMG payment reference
      # (pending_review). Blank/unset -> no alert is sent.
      PAYMENT_ALERT_EMAIL: ${PAYMENT_ALERT_EMAIL:-}
    volumes:
      - uploads_data:/app/uploads
    # No host port: the web container's nginx proxies /api -> api:3001 over the
    # compose network, so publishing 3001 only let clients skip nginx.

  web:
    build:
      context: ./web
      args:
        # Same-origin by default: the web container's nginx proxies /api -> api:3001.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    # No host port here. For local dev, docker-compose.override.yml publishes 8080
    # (see docker-compose.override.yml.example). In production, front it with a
    # reverse proxy — see "Deploying behind Traefik" in the README.

volumes:
  db_data:
  uploads_data:
