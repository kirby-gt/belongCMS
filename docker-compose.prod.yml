# Production overlay: publish the web app through the shared Traefik already
# running on the VPS.
#
# That Traefik runs with `network_mode: host` and the Docker-label provider
# (letsencrypt HTTP-01 resolver, global HTTP->HTTPS redirect). Host-mode Traefik
# reaches this container directly over its bridge network, so there is NOTHING to
# configure about networks here — the overlay only adds routing labels to `web`
# (nginx already reverse-proxies /api -> api:3001, so one router is enough).
#
# Turn it on by putting this in .env (so every bare `docker compose` keeps it):
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#   APP_DOMAIN=belongcms.org
#   APP_URL=https://belongcms.org
# Optional in .env (defaults shown):
#   TRAEFIK_CERTRESOLVER=letsencrypt   # your Traefik's ACME resolver name
#   TRAEFIK_ENTRYPOINT=websecure       # your Traefik's TLS entrypoint name
#
# Do NOT also keep a docker-compose.override.yml on this box — if COMPOSE_FILE
# is ever not picked up, the override silently wins and `web` comes up with no
# Traefik labels (bare "404 page not found" on the domain).

services:
  web:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.belongcms.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`) || Host(`www.${APP_DOMAIN}`)"
      - "traefik.http.routers.belongcms.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.belongcms.tls=true"
      - "traefik.http.routers.belongcms.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.belongcms.service=belongcms"
      - "traefik.http.services.belongcms.loadbalancer.server.port=80"
