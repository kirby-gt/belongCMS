# Production overlay: serve the web app through a Docker-provider Traefik
# (works with a host-network Traefik or a shared-network one).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Required in .env:
#   APP_DOMAIN=belongcms.org
#   APP_URL=https://belongcms.org
# Optional in .env (defaults shown):
#   TRAEFIK_NETWORK=belongcms_default      # the web container's docker network
#   TRAEFIK_CERTRESOLVER=letsencrypt       # your Traefik's ACME resolver name
#   TRAEFIK_ENTRYPOINT=websecure           # your Traefik's TLS entrypoint name
#
# The web container's nginx already reverse-proxies /api -> api:3001, so this is
# a single router to the web container — no API route needed.

services:
  web:
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-belongcms_default}"
      - "traefik.http.routers.belongcms.rule=Host(`${APP_DOMAIN:?set APP_DOMAIN in .env}`)"
      - "traefik.http.routers.belongcms.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.belongcms.tls=true"
      - "traefik.http.routers.belongcms.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.belongcms.service=belongcms"
      - "traefik.http.services.belongcms.loadbalancer.server.port=80"
