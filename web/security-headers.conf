# Included from every location in nginx.conf. nginx drops server-level
# add_header directives in any location that sets its own add_header (all of
# ours set Cache-Control), so these must be repeated per location via include.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers only honour this over HTTPS (Traefik terminates TLS in production).
add_header Strict-Transport-Security "max-age=31536000" always;
# Fonts come from Google Fonts; QR codes are data: URLs; everything else,
# including /api, is same-origin. No inline scripts (see public/theme-init.js).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
