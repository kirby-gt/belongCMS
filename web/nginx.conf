server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the api container so the whole app is served from one
    # origin. Works over a bare IP:port now and behind a domain/HTTPS later with
    # no extra port to expose, no CORS, and no mixed-content problems. Set the
    # frontend's VITE_API_URL to "/api" to use this.
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;   # member photo uploads
        add_header Cache-Control "no-store";
    }

    # Vite build assets are content-hashed in their filename, so a new deploy
    # produces new names — safe to cache these forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA entry point must be revalidated every load, otherwise the browser
    # keeps serving an old index.html that references stale asset hashes and new
    # deploys never appear.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
