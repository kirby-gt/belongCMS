server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite build assets are content-hashed in their filename, so a new deploy
    # produces new names — safe to cache these forever.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The SPA entry point must be revalidated every load, otherwise the browser
    # keeps serving an old index.html that references stale asset hashes and new
    # deploys never appear.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
